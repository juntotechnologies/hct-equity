[project]
name = "hct-equity"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dcurves>=1.1.7",
    "kaggle>=2.2.4",
    "lifelines>=0.30.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pydantic>=2.14.0",
    "scikit-survival>=0.28.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hct_equity"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "PLR", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-statements = 15
max-branches = 5
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
